[package]
name = "subforge-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Subtitle model, parsing and writing shared by SubForge"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
tokio-util = "0.7"
dirs = "6"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "io-util", "time", "macros", "rt"] }
subforge-deps = { path = "../subforge-deps", features = ["tokio"] }
subforge-metadata = { path = "../subforge-metadata" }
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3"
axum = "0.8"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net"] }
