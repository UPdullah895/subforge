[package]
name = "subforge-pipeline"
version = "0.3.0"
description = "Library pipeline for SubForge: what an episode still needs, and in what order"
authors = ["UPdullah895"]
license = "GPL-3.0-only"
repository = "https://github.com/UPdullah895/subforge"
edition = "2021"

[dependencies]
subforge-core = { path = "../subforge-core" }
subforge-metadata = { path = "../subforge-metadata" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
