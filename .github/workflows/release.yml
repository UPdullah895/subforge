name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--features gpu-vulkan'
          - platform: windows-latest
            args: '--features gpu-vulkan'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check version matches tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-versions.mjs "$TAG"

      - name: Install Tauri Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      # whisper.cpp's Vulkan backend (cargo feature gpu-vulkan) needs the Vulkan headers and
      # glslc to build; the SDK provides both and sets VULKAN_SDK. On Windows it also supplies the
      # redistributable loader (vulkan-1.dll) that the bundle ships; see packaging/bundled-tools.json.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.304.1
          install_runtime: false
          cache: true
          stripdown: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Set the bundled-tool download cache
        shell: bash
        run: echo "SUBFORGE_TOOLS_CACHE=$RUNNER_TEMP/tools-cache" >> "$GITHUB_ENV"

      - name: Cache bundled-tool downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tools-cache
          key: bundled-tools-${{ runner.os }}-${{ hashFiles('packaging/bundled-tools.json') }}

      # FFmpeg, MKVToolNix and the Vulkan loader for the Windows installer and the AppImage
      # (pinned + sha256-verified in packaging/bundled-tools.json; deb/rpm use system packages).
      - name: Fetch bundled tools
        shell: bash
        run: node scripts/fetch-bundled-tools.mjs ${{ matrix.platform == 'windows-latest' && 'windows-x64' || 'linux-x64' }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBFORGE_SUBSOURCE_API_KEY: ${{ secrets.SUBFORGE_SUBSOURCE_API_KEY }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: SubForge ${{ github.ref_name }}
          releaseBody: |
            ## Install
            - **Windows:** run the `.msi` or `-setup.exe`.
            - **Linux:** `.AppImage` (any distro), `.deb` or `.rpm`.

            The Windows installer and the AppImage include MKVToolNix and FFmpeg; the `.deb` and `.rpm` install them as dependencies.
            See the [README](https://github.com/UPdullah895/subforge#readme) for details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Corresponding source of the GPL/LGPL programs and libraries the installers redistribute
      # (packaging/bundled-tools.json "sources"), checksum-verified, attached once per release.
      - name: Attach GPL/LGPL corresponding sources
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/fetch-bundled-tools.mjs --sources "$RUNNER_TEMP/third-party-sources"
          gh release upload "$TAG" "$RUNNER_TEMP"/third-party-sources/* --clobber
