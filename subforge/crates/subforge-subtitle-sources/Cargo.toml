[package]
name = "subforge-subtitle-sources"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = "2"
subforge-metadata = { path = "../subforge-metadata" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
mockito = "1"
tempfile = "3"
