[package]
name = "subforge"
version = "0.1.0"
description = "Subtitle and audio toolkit: extract, merge, transcribe and translate subtitles"
authors = ["UPdullah895"]
license = "GPL-3.0-only"
repository = "https://github.com/UPdullah895/subforge"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "subforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "6"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread"] }
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
subforge-metadata = { path = "../crates/subforge-metadata" }
subforge-deps = { path = "../crates/subforge-deps", features = ["tokio"] }
subforge-subtitle-sources = { path = "../crates/subforge-subtitle-sources" }

